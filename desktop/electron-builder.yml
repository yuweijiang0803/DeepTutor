# electron-builder 打包配置
# 打包时：前端 standalone (web/.next/standalone) 作为 extraResources 随包分发，
# 运行时由 main.js 在内部拉起它的 Node 服务（见 desktop/main.js）。

appId: com.deeptutor.desktopshell
productName: DeepTutor
# 自动更新源：发版时把 dist-electron/latest.yml + 安装包上传到这里
# （服务器 nginx /updates/ 静态目录，见 deploy/desktop-release.sh）
publish:
  provider: generic
  url: https://tutor.hourofai.cn/updates
directories:
  output: dist-electron
  buildResources: build   # 应用图标 build/icon.icns|icon.ico|icon.png

# mac 未签名也能自动更新的关键：对打包出的 .app 做 ad-hoc 代码签名
# （Squirrel.Mac 更新要求 app 有有效签名）
afterPack: build/afterPack.js

files:
  - "main.js"
  - "preload.js"
  - "package.json"

extraResources:
  - from: "../web/.next/standalone"
    to: "web-standalone"
  # Bundled Node so the standalone server runs on machines without Node installed.
  # bundle-node.js (run before build) drops resources/node (or node.exe) here.
  - from: "resources"
    to: "."

mac:
  category: public.app-category.education   # K12 教育类
  target:
    # dmg = 用户首次安装；zip = electron-updater 自动更新必需（Squirrel.Mac 用 zip 做增量更新）
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 无开发者证书时打出的 dmg 未签名，本机/内测可直接开；广散或学校分发前需签名+公证。
  # —— 签名/公证占位（暂不使用，以后填证书即可）——
  # identity: null                       # 填 "Developer ID Application: ..." 即签名；留 null = 不签名
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist
  # afterSign: build/notarize.js        # 公证脚本占位（需 appleId/appleIdPassword）

win:
  target:
    - target: nsis
      arch:
        - x64
  # —— 签名占位（暂不使用）——
  # certificateFile: ./cert.pfx         # Windows 代码签名证书
  # certificatePassword: ${WIN_CERT_PASSWORD}

# Windows 安装器：向导式（可选安装路径），而非一键安装
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64

# 提示：DESKTOP_NODE_BIN 可强制指定打包内/系统外的 node 二进制路径用于调试。

