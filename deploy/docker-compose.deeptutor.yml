# 追加到 xiaozhi/docker-compose.yml 的 services: 下（两个服务）
# 注意：仅新增，不改动任何现有服务

  deeptutor:
    build:
      context: ./deeptutor
      # base = 纯后端镜像；跳过 development 阶段（不需要 npm/前端依赖）
      target: base
    container_name: deeptutor
    working_dir: /app
    volumes:
      - ./deeptutor:/app          # 代码挂载（rsync 更新后 force-recreate 生效）
      # DEEPTUTOR_HOME=/data，数据根是 <home>/data（/data/data），
      # 挂到这里使持久化数据落在 deeptutor-data/ 根下（含 user/settings）
      - ./deeptutor-data:/data/data
    command: ["deeptutor", "serve"]
    environment:
      - TZ=Asia/Shanghai
      - DEEPTUTOR_HOME=/data
    networks:
      - proxy-net
    restart: always

  deeptutor-web:
    build: ./deeptutor-web
    container_name: deeptutor-web
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - TZ=Asia/Shanghai
      - PORT=3782
      - DEEPTUTOR_API_BASE_URL=http://deeptutor:8001   # 后端地址（web/proxy.ts 读取）
      - DEEPTUTOR_AUTH_ENABLED=true
    networks:
      - proxy-net
    restart: always
