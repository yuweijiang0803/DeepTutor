<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepTutor 下载</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f7f9; margin: 0; padding: 40px 16px; text-align: center; }
  .card { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 16px;
          padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .ver { color: #888; font-size: 13px; margin-bottom: 24px; }
  .btn { display: block; background: #2563eb; color: #fff; text-decoration: none;
         font-size: 16px; padding: 14px; border-radius: 10px; margin: 12px 0; }
  .btn:hover { background: #1d4ed8; }
  .hint { color: #999; font-size: 12px; margin-top: 16px; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <h1>DeepTutor</h1>
    <div class="ver" id="ver">正在检测最新版本…</div>
    <div id="downloads"></div>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    // 读取更新元数据，自动匹配当前平台 + 架构，只显示对应版本的下载。
    function parseYml(text) {
      const ver = (text.match(/^version:\s*([\d.]+)/m) || [])[1] || "";
      const files = [];
      const re = /-\s*url:\s*(\S+)/g;
      let m;
      while ((m = re.exec(text))) files.push(m[1]);
      return { ver, files };
    }
    function isArm64() {
      return /arm64|aarch64/i.test(navigator.userAgent);
    }
    async function load() {
      const ua = navigator.userAgent;
      const isMac = /Mac|iPhone|iPad/i.test(ua);
      const isWin = /Win/i.test(ua);
      const meta = isMac ? "latest-mac.yml" : "latest.yml";
      let data = { ver: "", files: [] };
      try {
        const res = await fetch(meta, { cache: "no-store" });
        if (res.ok) data = parseYml(await res.text());
      } catch (e) { /* fall through */ }
      document.getElementById("ver").textContent = data.ver
        ? "最新版本 v" + data.ver : "未获取到版本信息";

      const dl = document.getElementById("downloads");
      const hint = document.getElementById("hint");
      let chosen = "";
      if (isMac) {
        // mac 选对应架构的 dmg（arm64 优先）
        chosen = isArm64()
          ? data.files.find(f => f.includes("arm64") && f.endsWith(".dmg"))
          : data.files.find(f => !f.includes("arm64") && f.endsWith(".dmg"))
            || data.files.find(f => f.endsWith(".dmg"));
        hint.innerHTML = "mac 版是免安装文件：下载 dmg → 双击打开 → 把 DeepTutor.app 拖到桌面/应用程序即可直接运行。";
      } else if (isWin) {
        chosen = data.files.find(f => f.endsWith(".exe"));
        hint.innerHTML = "Windows 版：下载 exe 安装后自动升级；或使用免安装 zip 版（解压即用）。";
      } else {
        chosen = data.files.find(f => f.endsWith(".AppImage"));
        hint.innerHTML = "Linux 版：下载 AppImage 后赋予执行权限即可运行。";
      }
      if (chosen) {
        const a = document.createElement("a");
        a.className = "btn";
        a.href = chosen;
        a.textContent = "下载 DeepTutor" + (data.ver ? " v" + data.ver : "");
        dl.appendChild(a);
      } else {
        dl.innerHTML = '<div style="color:#e11d48;font-size:13px">暂未找到可下载的安装包，请稍后再试。</div>';
      }
    }
    load();
  </script>
</body>
</html>
