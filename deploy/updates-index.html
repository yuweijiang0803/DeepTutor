<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepTutor 下载</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f7f9; margin: 0; padding: 40px 16px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px;
          padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sys { color: #888; font-size: 13px; margin: 0 0 20px; text-align: center; }
  .row { display: flex; align-items: center; gap: 12px; border: 1px solid #e5e7eb;
         border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .row.current { border: 2px solid #2563eb; background: #eff6ff; }
  .ver { font-weight: 600; font-size: 14px; min-width: 56px; }
  .tag { font-size: 11px; background: #2563eb; color: #fff; padding: 2px 8px;
         border-radius: 999px; }
  .files { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .dl { font-size: 13px; color: #2563eb; text-decoration: none; border: 1px solid #2563eb;
        padding: 5px 12px; border-radius: 8px; }
  .dl:hover { background: #2563eb; color: #fff; }
  .hint { color: #999; font-size: 12px; margin-top: 16px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <h1>DeepTutor 下载</h1>
    <div class="sys" id="sys">正在检测当前系统…</div>
    <div id="versions"></div>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    // 识别当前系统：mac(arm64/x64) / win / linux
    const ua = navigator.userAgent;
    const isMac = /Mac/i.test(ua);
    const isWin = /Win/i.test(ua);
    const isLinux = !isMac && !isWin && /Linux/i.test(ua);
    const isArm = /arm64|aarch64/i.test(ua);
    const sysLabel = isMac ? (isArm ? "macOS (Apple 芯片 M1/M2/M3…)" : "macOS (Intel)")
      : isWin ? "Windows" : isLinux ? "Linux" : "未知系统";
    const sysShort = isMac ? (isArm ? "Mac M1/M2" : "Mac Intel")
      : isWin ? "Windows" : isLinux ? "Linux" : "本系统";

    function keyFor() {
      if (isMac) return isArm ? "mac_arm64" : "mac_x64";
      if (isWin) return "win";
      return "linux";
    }
    const myKey = keyFor();

    async function load() {
      document.getElementById("sys").textContent = "当前系统：" + sysLabel;
      try {
        const res = await fetch("versions.json", { cache: "no-store" });
        if (!res.ok) throw new Error("no versions.json");
        const data = await res.json();
        render(data.versions || []);
      } catch (e) {
        document.getElementById("versions").innerHTML =
          '<div style="color:#e11d48;font-size:13px">无法读取版本列表，请刷新重试。</div>';
      }
    }

    function render(versions) {
      const box = document.getElementById("versions");
      box.innerHTML = "";
      // 最新版本在前；当前系统类型在【每个版本】都突出（标在当前系统对应的按钮上）
      versions.forEach((v) => {
        const row = document.createElement("div");
        const isCurrent = !!v[myKey]; // 该版本有当前系统可用的下载 → 突出
        row.className = "row" + (isCurrent ? " current" : "");
        row.innerHTML = '<div class="ver">v' + v.version + "</div>" +
          (isCurrent ? '<span class="tag">' + sysShort + "</span>" : "") +
          '<div class="files"></div>';
        // 该版本可下载的文件（当前系统优先排前）
        const filesDiv = row.querySelector(".files");
        const order = [myKey, "mac_arm64", "mac_x64", "win", "linux"];
        const seen = new Set();
        order.forEach((k) => {
          if (seen.has(k)) return;
          seen.add(k);
          const url = v[k];
          if (!url) return;
          const a = document.createElement("a");
          a.className = "dl";
          a.href = url;
          a.textContent =
            k === "mac_arm64" ? "Mac M1/M2" : k === "mac_x64" ? "Mac Intel"
            : k === "win" ? "Windows" : "Linux";
          filesDiv.appendChild(a);
        });
        if (filesDiv.childNodes.length === 0) filesDiv.textContent = "暂未发布";
        box.appendChild(row);
      });
    }
    load();
  </script>
</body>
</html>
