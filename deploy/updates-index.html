<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepTutor 下载</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f7f9; margin: 0; padding: 40px 16px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px;
          padding: 32px 28px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
  .sub { color: #888; font-size: 13px; margin: 0 0 20px; text-align: center; }
  .row { display: flex; align-items: center; gap: 12px; border: 1px solid #e5e7eb;
         border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; flex-wrap: wrap; }
  .ver { font-weight: 600; font-size: 14px; min-width: 56px; }
  .files { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .dl { font-size: 13px; color: #2563eb; text-decoration: none; border: 1px solid #2563eb;
        padding: 5px 12px; border-radius: 8px; }
  .dl:hover { background: #2563eb; color: #fff; }
  .hint { color: #999; font-size: 12px; margin-top: 16px; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <h1>DeepTutor 下载</h1>
    <div class="sub">选择你的系统版本下载</div>
    <div id="versions"></div>
    <div class="hint" id="hint"></div>
  </div>
  <script>
    async function load() {
      try {
        const res = await fetch("versions.json", { cache: "no-store" });
        if (!res.ok) throw new Error("no versions.json");
        const data = await res.json();
        render(data.versions || []);
      } catch (e) {
        document.getElementById("versions").innerHTML =
          '<div style="color:#e11d48;font-size:13px">无法读取版本列表，请刷新重试。</div>';
      }
      document.getElementById("hint").textContent =
        "mac 版是免安装文件：下载 dmg → 双击打开 → 把 DeepTutor.app 拖到桌面/应用程序即可直接运行。" +
        " 请按你的芯片选择：M1/M2/M3 等选 Mac M1/M2，Intel 芯片选 Mac Intel。" +
        " Windows 版下载 exe 安装后自动升级（SmartScreen 提示点\"仍要运行\"）。";
    }

    function render(versions) {
      const box = document.getElementById("versions");
      box.innerHTML = "";
      versions.forEach((v) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<div class="ver">v' + v.version + "</div>" +
          '<div class="files"></div>';
        const filesDiv = row.querySelector(".files");
        // 固定顺序：Mac M1/M2、Mac Intel、Windows、Linux（区分芯片，用户自选）
        const order = [
          ["mac_arm64", "Mac M1/M2"],
          ["mac_x64", "Mac Intel"],
          ["win", "Windows"],
          ["linux", "Linux"],
        ];
        order.forEach(([k, label]) => {
          const url = v[k];
          if (!url) return;
          const a = document.createElement("a");
          a.className = "dl";
          a.href = url;
          a.textContent = label;
          filesDiv.appendChild(a);
        });
        if (filesDiv.childNodes.length === 0) filesDiv.textContent = "暂未发布";
        box.appendChild(row);
      });
    }
    load();
  </script>
</body>
</html>
