# 追加到 xiaozhi/nginx/nginx.conf 的 http { ... } 内（放在其他 server 块之后）
# 域名 tutor.hourofai.cn 需先解析到服务器 IP
#
# 整站反代到 deeptutor-web（Next standalone）：
#   - 页面由它渲染
#   - /api、/api/v1/ws 由它的内置 proxy 转发到 deeptutor:8001
#   - 无需单独反代 /api（proxy.ts 已处理，且带 ws upgrade）

    server {
        listen 80;
        server_name tutor.hourofai.cn;

        # DeepTutor 桌面端自动更新（electron-updater 拉取安装包）
        # 注意：/app/xzserver/nginx/updates 会被部署同步删除（同步源无此目录），
        # 若被删请重建并保持 755（chmod 755 /app/xzserver/nginx/updates）。
        location /updates/ {
            alias /www/updates/;
            autoindex on;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://deeptutor-web:3782;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
