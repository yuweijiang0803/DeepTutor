# 追加到 xiaozhi/nginx/nginx.conf 的 http { ... } 内（放在其他 server 块之后）
# 域名 tutor.hourofai.cn 需先解析到服务器 IP
#
# 整站反代到 deeptutor-web（Next standalone）：
#   - 页面由它渲染
#   - /api、/api/v1/ws 由它的内置 proxy 转发到 deeptutor:8001
#   - 无需单独反代 /api（proxy.ts 已处理，且带 ws upgrade）

    server {
        listen 80;
        server_name tutor.hourofai.cn;

        location / {
            proxy_pass http://deeptutor-web:3782;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
