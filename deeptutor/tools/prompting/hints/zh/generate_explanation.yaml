short_description: "用 OpenMAIC 生成一个简短的结构化讲解课件（1-3 页，配语音），供学生在内嵌播放器里观看。"
when_to_use: "当用户明确要求「生成讲解 / 生成讲解视频 / AI 老师讲 / 给我做个讲解 / 听不懂给我讲一讲 / 讲清楚一点」这类**结构化、可播放**的讲解时，**必须调用本工具**，不要只用文字回答。注意：普通的口头答疑（一句话能说清的）用文字即可；但一旦用户要求『生成』『做一个讲解』『录个讲解』『AI 老师讲』，就调用本工具生成可播放的讲解。用户说『帮我生成一个讲解：XXX』时一定调用。"
input_format: "{\"topic\": \"要讲解的知识点，如『什么是绝对值』\", \"extra_context\": \"可选：学生已有的知识/卡住的点/所在课程，帮助针对性讲解\"}"
guideline: "调用后告诉用户讲解正在生成（需要几分钟），然后如实转述结果。生成完成后返回可播放的讲解地址，让用户在内嵌播放器里观看。不要假装已经生成了——必须等工具返回成功。"
note: "生成是异步的，通常需要 1-10 分钟。如果失败或超时，如实告知并建议稍后重试。"
phase: "expansion"
